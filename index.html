<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f1f28" />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        const appearance = JSON.parse(localStorage.getItem("portfolio-appearance"))
        for (const key of ["theme", "accent"]) {
          if (typeof appearance?.[key] === "string") document.documentElement.dataset[key] = appearance[key]
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/styles/terminalThemes.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />

    <!-- Self-hosted open fonts; licenses are included in public/fonts. -->
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The page <title> and description are set from src/content/site.js -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
